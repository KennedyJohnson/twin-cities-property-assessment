name: Monthly data refresh

# Re-pulls sales, permits, inspections and the newest published assessment year, rebuilds
# site/data, commits, and redeploys Pages. The assessment year is discovered, not hardcoded.
on:
  schedule:
    - cron: "0 9 3 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r ../requirements.txt
      - run: python fetch_hennepin.py
      - run: python fetch_minneapolis.py
      - run: python fetch_sale_history.py
      - run: python fetch_permits.py
      - run: python fetch_condition.py
      - run: python model.py
      - run: python build_site.py
      - name: Commit and redeploy
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "{\"updated\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > site/data/last_updated.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data tracking
          git diff --staged --quiet || git commit -m "chore: monthly data refresh [automated]"
          git push
          # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly.
          gh workflow run pages.yml
      - name: Check a new assessment year has been published
        # Minneapolis normally posts the new year's layer by spring.
        run: |
          year=$(python years.py)
          if [ "$(date +%-m)" -ge 6 ] && [ "$year" -lt "$(date +%Y)" ]; then
            echo "::error::Assessment data for $(date +%Y) not found (latest $year). Check opendata.minneapolismn.gov."
            exit 1
          fi

  alert-on-failure:
    needs: refresh
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              ...context.repo,
              title: `Data refresh failed (${new Date().toISOString().slice(0,10)})`,
              body: `Site data is going stale.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['stale-data'],
            });
